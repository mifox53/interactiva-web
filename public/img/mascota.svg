<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="mascota-titulo">
  <title id="mascota-titulo">Mascota de la emisora: un zorro fucsia con audífonos</title>
  <defs>
    <linearGradient id="pelo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f25ad6"/>
      <stop offset="1" stop-color="#d22fb4"/>
    </linearGradient>
    <linearGradient id="cresta" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2fe4ff"/>
      <stop offset="1" stop-color="#2b6ff2"/>
    </linearGradient>
    <linearGradient id="chaqueta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3f86"/>
      <stop offset="1" stop-color="#16214d"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#7fe9ff"/>
      <stop offset="0.55" stop-color="#1fa8ea"/>
      <stop offset="1" stop-color="#1557b8"/>
    </radialGradient>
    <linearGradient id="copa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3f4d"/>
      <stop offset="1" stop-color="#14161d"/>
    </linearGradient>
  </defs>

  <!-- Chaqueta y pecho -->
  <path d="M88 400 C92 352 128 330 170 322 L230 322 C272 330 308 352 312 400 Z" fill="url(#chaqueta)"/>
  <path d="M170 322 L200 372 L230 322 Z" fill="#fbeff8"/>
