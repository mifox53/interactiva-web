  <ellipse cx="240" cy="202" rx="29" ry="33" fill="#ffffff" stroke="#3a1036" stroke-width="3"/>
  <circle cx="162" cy="206" r="19" fill="url(#iris)"/>
  <circle cx="242" cy="206" r="19" fill="url(#iris)"/>
  <circle cx="163" cy="207" r="10" fill="#0d1020"/>
  <circle cx="243" cy="207" r="10" fill="#0d1020"/>
