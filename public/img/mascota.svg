  <path d="M184 246 C184 238 216 238 216 246 C216 256 206 264 200 264 C194 264 184 256 184 246 Z" fill="#141420"/>
  <ellipse cx="194" cy="244" rx="6" ry="3" fill="#ffffff" opacity="0.55"/>

