  <path d="M200 264 L200 272" stroke="#3a1036" stroke-width="3" stroke-linecap="round"/>
  <path d="M164 270 C176 278 190 276 200 272 C210 276 224 278 236 270 C234 296 218 310 200 310 C182 310 166 296 164 270 Z" fill="#5c1235"/>
  <path d="M178 298 C186 290 214 290 222 298 C216 306 208 310 200 310 C192 310 184 306 178 298 Z" fill="#ff6b98"/>
  <path d="M189 273 L199 273 L198 285 C198 288 190 288 190 285 Z" fill="#ffffff"/>
  <path d="M201 273 L211 273 L210 285 C210 288 202 288 202 285 Z" fill="#ffffff"/>

  <!-- Copas de los audífonos -->
  <rect x="58" y="176" width="52" height="82" rx="24" fill="url(#copa)"/>
  <rect x="68" y="188" width="32" height="58" rx="15" fill="#c9ced8"/>
  <rect x="74" y="196" width="20" height="42" rx="10" fill="#1b1e27" stroke="#2fe4ff" stroke-width="3"/>
  <rect x="290" y="176" width="52" height="82" rx="24" fill="url(#copa)"/>
  <rect x="300" y="188" width="32" height="58" rx="15" fill="#c9ced8"/>
  <rect x="306" y="196" width="20" height="42" rx="10" fill="#1b1e27" stroke="#2fe4ff" stroke-width="3"/>

  <!-- Micrófono -->
  <path d="M316 250 C314 284 290 300 252 302" fill="none" stroke="#23262f" stroke-width="7" stroke-linecap="round"/>
  <rect x="232" y="294" width="26" height="16" rx="8" fill="#14161d"/>
  <rect x="236" y="298" width="8" height="8" rx="4" fill="#2fe4ff"/>
</svg>
