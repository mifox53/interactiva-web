  <path d="M142 142 Q128 124 112 106 Q140 106 154 118 Q146 92 138 72 Q166 82 178 106 Q176 76 170 48 Q198 64 204 98 Q212 70 210 42 Q234 64 230 102 Q246 82 250 58 Q266 86 254 118 Q266 110 280 100 Q278 124 262 138 C240 122 220 118 200 118 C178 118 160 126 142 142 Z" fill="url(#cresta)"/>
