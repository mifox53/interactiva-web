  <path d="M86 214 C82 118 136 74 200 74 C264 74 318 118 314 214" fill="none" stroke="#23262f" stroke-width="15" stroke-linecap="round"/>
  <path d="M96 196 C96 124 142 88 200 88 C258 88 304 124 304 196" fill="none" stroke="#5b6170" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

