  <path d="M250 328 L200 392 L232 400 L268 400 C264 368 260 346 250 328 Z" fill="#2f4a9a"/>
  <path d="M176 318 C186 334 214 334 224 318 L224 300 L176 300 Z" fill="#d22fb4"/>

  <!-- Orejas (detrás de la cabeza) -->
  <path d="M112 170 L92 46 C132 58 164 88 182 124 Z" fill="url(#pelo)"/>
  <path d="M120 150 L106 70 C132 82 152 104 164 128 Z" fill="#f6e9f6"/>
  <path d="M288 170 L308 46 C268 58 236 88 218 124 Z" fill="url(#pelo)"/>
  <path d="M280 150 L294 70 C268 82 248 104 236 128 Z" fill="#f6e9f6"/>

  <!-- Cabeza con mechones en las mejillas -->
  <path d="M200 98 C268 98 314 140 318 200 C320 232 312 254 300 270 L322 284 L292 290 L304 306 L272 304 C252 318 228 324 200 324 C172 324 148 318 128 304 L96 306 L108 290 L78 284 L100 270 C88 254 80 232 82 200 C86 140 132 98 200 98 Z" fill="url(#pelo)"/>
